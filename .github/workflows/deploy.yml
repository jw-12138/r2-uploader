# R2 Uploader - Automated Deployment
# 
# This workflow deploys both the Worker (backend) and Pages (frontend) on push to main.
#
# Required GitHub Secrets:
#   - CLOUDFLARE_API_TOKEN: API token with Workers/Pages/R2 permissions
#   - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare account ID
#
# Optional GitHub Variables:
#   - VITE_WORKER_URL: Pre-populate the Worker URL in the web UI

name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  deploy-web:
    name: Deploy Web (Pages)
    runs-on: ubuntu-latest
    needs: deploy-worker  # Deploy web after worker so we can reference the worker URL
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build:web
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=r2-uploader

